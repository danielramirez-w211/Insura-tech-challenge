<app-header (menuToggle)="sidenavOpened = !sidenavOpened" />

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    mode="side"
    [opened]="sidenavOpened"
    class="sidenav">
    <app-sidenav />
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
