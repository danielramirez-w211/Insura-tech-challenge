<app-page-header title="Mi Equipo de Asesores" />

@if (loading()) {
  <app-loading-spinner [loading]="true" />
} @else {
  <div class="table-container">
    <mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="advisorCode">
        <mat-header-cell *matHeaderCellDef>Código</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.advisorCode }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="name">
        <mat-header-cell *matHeaderCellDef>Nombre</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.firstName }} {{ row.lastName }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="email">
        <mat-header-cell *matHeaderCellDef>Email</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.email }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="salesCount">
        <mat-header-cell *matHeaderCellDef>Pólizas vendidas</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <span class="sales-badge">{{ row.salesCount }}</span>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="status">
        <mat-header-cell *matHeaderCellDef>Estado</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <span [class]="row.isActive ? 'chip-active' : 'chip-inactive'">
            {{ row.isActive ? 'Activo' : 'Inactivo' }}
          </span>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef></mat-header-cell>
        <mat-cell *matCellDef="let row">
          <button mat-icon-button
                  [matTooltip]="row.isActive ? 'Desactivar' : 'Activar'"
                  [color]="row.isActive ? 'warn' : 'primary'"
                  (click)="toggle(row)">
            <mat-icon>{{ row.isActive ? 'person_off' : 'person' }}</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns" />
      <mat-row *matRowDef="let row; columns: displayedColumns;" />
    </mat-table>

    @if (dataSource.data.length === 0) {
      <div class="empty">No tienes asesores asignados aún.</div>
    }
  </div>
}
